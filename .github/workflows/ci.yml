name: Retail Star Schema

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check Python formatting
        run: ruff format --check scripts tests

      - name: Run Ruff lint checks
        run: ruff check scripts tests

      - name: Test schema generation and SQL queries
        run: python -m pytest -q

      - name: Build star schema and run KPI queries
        run: |
          python scripts/build_star_schema.py
          python scripts/run_queries.py

      - name: Upload generated database
        if: always() && hashFiles('data/warehouse.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: retail-star-schema-database
          path: data/warehouse.db
          if-no-files-found: warn
          retention-days: 7
